name: season-update

# 시즌이 바뀌거나 poedb 의 한국어 데이터가 갱신되면 자동으로 받아
# src/KR 을 다시 만들고, 변경이 있을 때만 버전을 올려 새 릴리스를 만든다.
#   - 매주 수요일 05:00 (KST) = 화요일 20:00 (UTC)
#   - 수동 실행도 가능 (workflow_dispatch)

on:
  schedule:
    - cron: "0 20 * * 2"
  workflow_dispatch:
    inputs:
      tree_version:
        description: "PoE 트리 버전 강제 (예: 3_31, 비우면 PoB 최신 자동)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: season-update
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
      version: ${{ steps.commit.outputs.version }}
      season: ${{ steps.commit.outputs.season }}
    steps:
      - name: 체크아웃
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch || 'main' }}
          fetch-depth: 0

      - name: Python 준비
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 의존성 설치
        run: python -m pip install --quiet --upgrade pip pillow lupa

      - name: PoB 원문 데이터 준비 (Gems.lua, TreeData)
        id: pob
        run: |
          set -e
          VERSION_ARG=""
          if [ -n "${{ inputs.tree_version }}" ]; then VERSION_ARG="--version ${{ inputs.tree_version }}"; fi
          python tools/fetch_pob.py $VERSION_ARG | tee /tmp/pob.txt
          echo "tree_version=$(sed -n 's/^TREE_VERSION=//p' /tmp/pob.txt)" >> "$GITHUB_OUTPUT"
          echo "pob_src=$(sed -n 's/^POB_SRC=//p' /tmp/pob.txt)" >> "$GITHUB_OUTPUT"

      - name: 한국어 사전 갱신 (poedb → data/, src/KR/)
        env:
          POB_SRC: ${{ steps.pob.outputs.pob_src }}
          POE_TREE_VERSION: ${{ steps.pob.outputs.tree_version }}
        run: python tools/run_all.py

      - name: 결과 확인
        run: |
          set -e
          test -s src/KR/Data/exact.lua
          test -s src/KR/Data/templates.lua
          test -s src/KR/Fonts/kr_full.png
          test -s src/KR/Fonts/metrics.lua
          ls -l src/KR/Data src/KR/Fonts | head -30

      - name: 변경 감지 · 버전 올리기 · 커밋
        id: commit
        run: |
          set -e
          git config user.name "PoB-KR-Patcher Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A src data
          if git diff --cached --quiet -- src/KR/Data data; then
            # 번역 데이터는 그대로이고 폰트 렌더링만 달라진 경우 → 되돌리고 끝낸다
            git reset -q
            git checkout -- src || true
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "번역 데이터 변경 없음 — 릴리스하지 않습니다."
            exit 0
          fi
          NEW=$(python tools/bump_version.py --tree "${{ steps.pob.outputs.tree_version }}")
          SEASON=$(python -c "import json;print(json.load(open('version.json'))['season'])")
          POBV=$(python -c "import json;print(json.load(open('version.json'))['pob'])")
          git add -A src data version.json
          git commit -m "data: 시즌 데이터 갱신 — PoE1 $SEASON / PoB $POBV (v$NEW)"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "version=$NEW" >> "$GITHUB_OUTPUT"
          echo "season=$SEASON" >> "$GITHUB_OUTPUT"
          echo "새 버전: v$NEW (PoE1 $SEASON / PoB $POBV)"

  build:
    needs: refresh
    if: needs.refresh.outputs.changed == 'true'
    uses: ./.github/workflows/build-release.yml
    with:
      version: ${{ needs.refresh.outputs.version }}
    permissions:
      contents: write
